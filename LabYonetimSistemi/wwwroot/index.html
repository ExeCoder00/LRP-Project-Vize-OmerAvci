<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LRP Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <style>
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #212529;
            position: fixed;
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .nav-link {
            color: #adb5bd;
            cursor: pointer;
        }

            .nav-link:hover {
                color: white;
                background: #343a40;
            }
    </style>
</head>
<body>
    <div class="sidebar p-3">
        <h4>LRP Admin</h4><hr>
        <ul class="nav flex-column gap-2">
            <li class="nav-item"><a class="nav-link" onclick="loadPage('/view/dashboard.html')"><i class="fas fa-chart-pie me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadPage('/view/labs.html')"><i class="fas fa-door-open me-2"></i>Lab Yönetimi</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadPage('/view/computers.html')"><i class="fas fa-laptop me-2"></i>Bilgisayarlar</a></li>
            <li class="nav-item"><a class="nav-link" onclick="loadPage('/view/students.html')"><i class="fas fa-user-graduate me-2"></i>Öğrenciler</a></li>
            <li class="nav-item mt-5"><a class="nav-link text-danger" onclick="localStorage.clear(); location.href='/login.html'"><i class="fas fa-sign-out-alt me-2"></i>Çıkış</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div id="page-content"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Yetki Kontrolü
        const role = localStorage.getItem("userRole");
        if (!role || role !== "Admin") {
            location.href = "/login.html";
        }
        async function loadPage(url) {
            const res = await fetch(url);
            document.getElementById("page-content").innerHTML = await res.text();
            const scripts = document.getElementById("page-content").querySelectorAll("script");
            scripts.forEach(s => {
                const newS = document.createElement("script");
                newS.text = s.text;
                document.body.appendChild(newS).parentNode.removeChild(newS);
            });
        }
        window.onload = () => loadPage('/view/dashboard.html');
    </script>
</body>
</html>
