<style>
    .table-responsive {
        overflow-x: auto;
    }

    .btn-sm {
        white-space: nowrap;
    }
</style>

<div class="page-header">
    <h3><i class="fas fa-laptop me-2"></i>Bilgisayar Yönetimi</h3>
    <button class="btn btn-primary" onclick="openModal()">
        <i class="fas fa-plus me-1"></i>Yeni Bilgisayar Ekle
    </button>
</div>

<div class="table-card table-responsive">
    <table class="table table-hover mb-0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Demirbaş Kodu</th>
                <th>Marka</th>
                <th>İşlemci</th>
                <th>RAM</th>
                <th>Lab</th>
                <th>Özellikler</th>
                <th>İşlemler</th>
            </tr>
        </thead>
        <tbody id="pcTableBody"></tbody>
    </table>
</div>

<div class="modal fade" id="pcModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0" style="border-radius:12px; overflow:hidden;">
            <div class="modal-header" style="background:#1e2a38; color:white;">
                <h5 class="modal-title"><i class="fas fa-laptop me-2"></i>Bilgisayar Formu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="pcId">
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label text-muted small">Marka</label>
                        <input type="text" id="pcBrand" class="form-control" placeholder="Dell, HP...">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-muted small">İşlemci</label>
                        <input type="text" id="pcProcessor" class="form-control" placeholder="Intel, AMD...">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-muted small">RAM (GB)</label>
                        <input type="number" id="pcRam" class="form-control" placeholder="8, 16...">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-muted small">Lab ID</label>
                        <input type="number" id="pcLabId" class="form-control" placeholder="1, 2...">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted small">Donanım Özellikleri</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="pcHdmi">
                                <label class="form-check-label">HDMI</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="pcInternet">
                                <label class="form-check-label">İnternet</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="pcVeyon">
                                <label class="form-check-label">Veyon</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                <button class="btn btn-primary" onclick="savePc()">
                    <i class="fas fa-save me-1"></i>Kaydet
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    async function getPcs() {
        const res = await fetch("/api/admin/computers");
        const pcs = await res.json();
        document.getElementById("pcTableBody").innerHTML = pcs.map(p => `
            <tr>
                <td><span class="badge bg-secondary">${p.id}</span></td>
                <td><code>${p.assetCode ?? "-"}</code></td>
                <td><strong>${p.brand}</strong></td>
                <td>${p.processor}</td>
                <td><span class="badge bg-info text-dark">${p.ram} GB</span></td>
                <td><span class="badge bg-primary">Lab ${p.labId}</span></td>
                <td>
                    ${p.hasHdmi ? '<span class="badge bg-success me-1">HDMI</span>' : ''}
                    ${p.hasInternet ? '<span class="badge bg-success me-1">Net</span>' : ''}
                    ${p.hasVeyon ? '<span class="badge bg-success">Veyon</span>' : ''}
                </td>
                <td style="white-space:nowrap;">
                    <button class="btn btn-sm btn-outline-warning me-1" onclick="editPc(${p.id},'${p.brand}','${p.processor}',${p.ram},${p.labId},${p.hasHdmi},${p.hasInternet},${p.hasVeyon})">
                        <i class="fas fa-edit"></i> Düzenle
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deletePc(${p.id})">
                        <i class="fas fa-trash"></i> Sil
                    </button>
                </td>
            </tr>`).join("");
    }

    function openModal() {
        document.getElementById("pcId").value = "";
        document.getElementById("pcBrand").value = "";
        document.getElementById("pcProcessor").value = "";
        document.getElementById("pcRam").value = "";
        document.getElementById("pcLabId").value = "";
        document.getElementById("pcHdmi").checked = false;
        document.getElementById("pcInternet").checked = false;
        document.getElementById("pcVeyon").checked = false;
        new bootstrap.Modal(document.getElementById('pcModal')).show();
    }

    function editPc(id, brand, processor, ram, labId, hdmi, internet, veyon) {
        document.getElementById("pcId").value = id;
        document.getElementById("pcBrand").value = brand;
        document.getElementById("pcProcessor").value = processor;
        document.getElementById("pcRam").value = ram;
        document.getElementById("pcLabId").value = labId;
        document.getElementById("pcHdmi").checked = hdmi;
        document.getElementById("pcInternet").checked = internet;
        document.getElementById("pcVeyon").checked = veyon;
        new bootstrap.Modal(document.getElementById('pcModal')).show();
    }

    async function savePc() {
        const id = document.getElementById("pcId").value;
        const method = id ? "PUT" : "POST";
        const url = id ? `/api/admin/computers/${id}` : "/api/admin/computers/";
        await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                brand: document.getElementById("pcBrand").value,
                processor: document.getElementById("pcProcessor").value,
                ram: parseInt(document.getElementById("pcRam").value),
                labId: parseInt(document.getElementById("pcLabId").value),
                hasHdmi: document.getElementById("pcHdmi").checked,
                hasInternet: document.getElementById("pcInternet").checked,
                hasVeyon: document.getElementById("pcVeyon").checked
            })
        });
        bootstrap.Modal.getInstance(document.getElementById('pcModal')).hide();
        getPcs();
    }

    async function deletePc(id) {
        if (confirm("Silmek istediğinize emin misiniz?")) {
            await fetch("/api/admin/computers/" + id, { method: "DELETE" });
            getPcs();
        }
    }

    getPcs();
</script>
