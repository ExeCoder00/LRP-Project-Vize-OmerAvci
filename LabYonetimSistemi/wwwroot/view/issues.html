<div class="page-header">
    <h3><i class="fas fa-exclamation-triangle me-2"></i>Sorun Kayıtları</h3>
    <button class="btn btn-primary" onclick="openModal()">
        <i class="fas fa-plus me-1"></i>Yeni Sorun Ekle
    </button>
</div>

<div class="table-card table-responsive">
    <table class="table table-hover mb-0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Kategori</th>
                <th>Açıklama</th>
                <th>Bilgisayar ID</th>
                <th>Durum</th>
                <th>İşlemler</th>
            </tr>
        </thead>
        <tbody id="issueTableBody"></tbody>
    </table>
</div>

<div class="modal fade" id="issueModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0" style="border-radius:12px; overflow:hidden;">
            <div class="modal-header" style="background:#1e2a38; color:white;">
                <h5 class="modal-title"><i class="fas fa-exclamation-triangle me-2"></i>Sorun Formu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="issueId">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label text-muted small">Kategori</label>
                        <select id="issueCategory" class="form-select">
                            <option value="Donanım">Donanım</option>
                            <option value="Yazılım">Yazılım</option>
                            <option value="Ağ">Ağ</option>
                            <option value="Diğer">Diğer</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted small">Açıklama</label>
                        <textarea id="issueDescription" class="form-control" rows="3" placeholder="Sorun açıklaması..."></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted small">Bilgisayar ID</label>
                        <input type="number" id="issueComputerId" class="form-control" placeholder="Bilgisayar ID">
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                <button class="btn btn-primary" onclick="saveIssue()">
                    <i class="fas fa-save me-1"></i>Kaydet
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    async function getIssues() {
        const res = await fetch("/api/admin/issues");
        const issues = await res.json();
        document.getElementById("issueTableBody").innerHTML = issues.length > 0
            ? issues.map(i => `
                <tr>
                    <td><span class="badge bg-secondary">${i.id}</span></td>
                    <td><span class="badge bg-warning text-dark">${i.category}</span></td>
                    <td>${i.description}</td>
                    <td><span class="badge bg-primary">PC #${i.computerId}</span></td>
                    <td>
                        ${i.isResolved
                            ? '<span class="badge bg-success">✅ Çözüldü</span>'
                            : '<span class="badge bg-danger">⚠️ Açık</span>'}
                    </td>
                    <td style="white-space:nowrap;">
                        ${!i.isResolved ? `
                        <button class="btn btn-sm btn-outline-success me-1" onclick="resolveIssue(${i.id})">
                            <i class="fas fa-check"></i> Çözüldü
                        </button>` : ''}
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteIssue(${i.id})">
                            <i class="fas fa-trash"></i> Sil
                        </button>
                    </td>
                </tr>`).join("")
            : `<tr><td colspan="6" class="text-center text-muted py-4">Henüz sorun kaydı yok.</td></tr>`;
    }

    function openModal() {
        document.getElementById("issueId").value = "";
        document.getElementById("issueCategory").value = "Donanım";
        document.getElementById("issueDescription").value = "";
        document.getElementById("issueComputerId").value = "";
        new bootstrap.Modal(document.getElementById('issueModal')).show();
    }

    async function saveIssue() {
        await fetch("/api/admin/issues/", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                category: document.getElementById("issueCategory").value,
                description: document.getElementById("issueDescription").value,
                computerId: parseInt(document.getElementById("issueComputerId").value),
                isResolved: false
            })
        });
        bootstrap.Modal.getInstance(document.getElementById('issueModal')).hide();
        getIssues();
    }

    async function resolveIssue(id) {
        await fetch(`/api/admin/issues/${id}/resolve`, { method: "PUT" });
        getIssues();
    }

    async function deleteIssue(id) {
        if(confirm("Silmek istediğinize emin misiniz?")) {
            await fetch("/api/admin/issues/"+id, { method: "DELETE" });
            getIssues();
        }
    }

    getIssues();
</script>
