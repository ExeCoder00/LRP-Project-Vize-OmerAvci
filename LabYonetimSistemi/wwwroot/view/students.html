<div class="page-header">
    <h3><i class="fas fa-user-graduate me-2"></i>Öğrenci Yönetimi</h3>
    <button class="btn btn-primary" onclick="openModal()">
        <i class="fas fa-plus me-1"></i>Yeni Öğrenci Ekle
    </button>
</div>

<div class="table-card">
    <table class="table table-hover mb-0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Ad Soyad</th>
                <th>Sınıf</th>
                <th>Kullanıcı Adı</th>
                <th>Bilgisayar ID</th>
                <th>İşlemler</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>
</div>

<div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0" style="border-radius:12px; overflow:hidden;">
            <div class="modal-header" style="background:#1e2a38; color:white;">
                <h5 class="modal-title"><i class="fas fa-user-graduate me-2"></i>Öğrenci Formu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="studentId">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label text-muted small">Ad Soyad</label>
                        <input type="text" id="studentFullName" class="form-control" placeholder="Öğrenci adı soyadı">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-muted small">Sınıf</label>
                        <select id="studentGrade" class="form-select">
                            <option value="1">1. Sınıf</option>
                            <option value="2">2. Sınıf</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-muted small">Kullanıcı Adı (Öğrenci No)</label>
                        <input type="text" id="studentUsername" class="form-control" placeholder="Öğrenci no">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted small">Bilgisayar ID</label>
                        <input type="number" id="studentComputerId" class="form-control" placeholder="Zimmetli bilgisayar ID">
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
                <button class="btn btn-primary" onclick="saveStudent()">
                    <i class="fas fa-save me-1"></i>Kaydet
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    async function getStudents() {
        const res = await fetch("/api/admin/students");
        const students = await res.json();
        document.getElementById("studentTableBody").innerHTML = students.map(s => `
            <tr>
                <td><span class="badge bg-secondary">${s.id}</span></td>
                <td><strong>${s.fullName}</strong></td>
                <td><span class="badge bg-info text-dark">${s.grade}. Sınıf</span></td>
                <td><code>${s.username}</code></td>
                <td><span class="badge bg-primary">PC #${s.computerId}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-warning me-1" onclick="editStudent(${s.id},'${s.fullName}',${s.grade},'${s.username}',${s.computerId})">
                        <i class="fas fa-edit"></i> Düzenle
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${s.id})">
                        <i class="fas fa-trash"></i> Sil
                    </button>
                </td>
            </tr>`).join("");
    }

    function openModal() {
        document.getElementById("studentId").value = "";
        document.getElementById("studentFullName").value = "";
        document.getElementById("studentGrade").value = "1";
        document.getElementById("studentUsername").value = "";
        document.getElementById("studentComputerId").value = "";
        new bootstrap.Modal(document.getElementById('studentModal')).show();
    }

    function editStudent(id, fullName, grade, username, computerId) {
        document.getElementById("studentId").value = id;
        document.getElementById("studentFullName").value = fullName;
        document.getElementById("studentGrade").value = grade;
        document.getElementById("studentUsername").value = username;
        document.getElementById("studentComputerId").value = computerId;
        new bootstrap.Modal(document.getElementById('studentModal')).show();
    }

    async function saveStudent() {
        const id = document.getElementById("studentId").value;
        const method = id ? "PUT" : "POST";
        const url = id ? `/api/admin/students/${id}` : "/api/admin/students/";
        await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                fullName: document.getElementById("studentFullName").value,
                grade: parseInt(document.getElementById("studentGrade").value),
                username: document.getElementById("studentUsername").value,
                computerId: parseInt(document.getElementById("studentComputerId").value)
            })
        });
        bootstrap.Modal.getInstance(document.getElementById('studentModal')).hide();
        getStudents();
    }

    async function deleteStudent(id) {
        if (confirm("Silmek istediğinize emin misiniz?")) {
            await fetch("/api/admin/students/" + id, { method: "DELETE" });
            getStudents();
        }
    }

    getStudents();
</script>
