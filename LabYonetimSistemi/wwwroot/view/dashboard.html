<div class="page-header">
    <h3><i class="fas fa-chart-pie me-2"></i>Sistem Özeti</h3>
</div>

<div class="row g-4 mb-4">
    <div class="col-md-2">
        <div class="stat-card" style="background: linear-gradient(135deg, #1e2a38, #2c3e50);">
            <h6><i class="fas fa-door-open me-1"></i>Laboratuvarlar</h6>
            <h2 id="stat-labs">0</h2>
        </div>
    </div>
    <div class="col-md-2">
        <div class="stat-card" style="background: linear-gradient(135deg, #0077b6, #023e8a);">
            <h6><i class="fas fa-laptop me-1"></i>Bilgisayarlar</h6>
            <h2 id="stat-pcs">0</h2>
        </div>
    </div>
    <div class="col-md-2">
        <div class="stat-card" style="background: linear-gradient(135deg, #2d6a4f, #1b4332);">
            <h6><i class="fas fa-user-graduate me-1"></i>Öğrenciler</h6>
            <h2 id="stat-students">0</h2>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card" style="background: linear-gradient(135deg, #c1121f, #780000);">
            <h6><i class="fas fa-exclamation-triangle me-1"></i>Açık Sorunlar</h6>
            <h2 id="stat-issues">0</h2>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card" style="background: linear-gradient(135deg, #198754, #0a3622);">
            <h6><i class="fas fa-check-circle me-1"></i>Çözülen Sorunlar</h6>
            <h2 id="stat-resolved">0</h2>
        </div>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="table-card p-4">
            <h6 class="fw-bold mb-3"><i class="fas fa-exclamation-triangle text-danger me-2"></i>Açık Sorunlar</h6>
            <div id="openIssuesList"></div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="table-card p-4">
            <h6 class="fw-bold mb-3"><i class="fas fa-check-circle text-success me-2"></i>Son Çözülen Sorunlar</h6>
            <div id="resolvedIssuesList"></div>
        </div>
    </div>
</div>

<script>
    (async () => {
        const res = await fetch("/api/stats");
        const data = await res.json();
        document.getElementById("stat-labs").innerText = data.labCount;
        document.getElementById("stat-pcs").innerText = data.pcCount;
        document.getElementById("stat-students").innerText = data.studentCount;
        document.getElementById("stat-issues").innerText = data.issueCount;

        const issueRes = await fetch("/api/admin/issues");
        const issues = await issueRes.json();
        const openIssues = issues.filter(i => !i.isResolved);
        const resolvedIssues = issues.filter(i => i.isResolved);

        document.getElementById("stat-resolved").innerText = resolvedIssues.length;

        document.getElementById("openIssuesList").innerHTML = openIssues.length > 0
            ? openIssues.map(i => `
                <div class="d-flex justify-content-between align-items-center p-2 mb-2" style="background:#fff5f5; border-radius:8px; border-left:3px solid #dc3545">
                    <div>
                        <span class="badge bg-warning text-dark me-1">${i.category}</span>
                        <small>${i.description}</small>
                    </div>
                    <small class="text-muted">PC #${i.computerId}</small>
                </div>`).join("")
            : `<p class="text-muted text-center py-3"><i class="fas fa-check-circle text-success me-1"></i>Açık sorun yok!</p>`;

        document.getElementById("resolvedIssuesList").innerHTML = resolvedIssues.length > 0
            ? resolvedIssues.slice(-5).reverse().map(i => `
                <div class="d-flex justify-content-between align-items-center p-2 mb-2" style="background:#f0fff4; border-radius:8px; border-left:3px solid #198754">
                    <div>
                        <span class="badge bg-success me-1">${i.category}</span>
                        <small>${i.description}</small>
                    </div>
                    <small class="text-muted">PC #${i.computerId}</small>
                </div>`).join("")
            : `<p class="text-muted text-center py-3">Henüz çözülen sorun yok.</p>`;
    })();
</script>
