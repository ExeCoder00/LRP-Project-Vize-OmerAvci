<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LRP Öğrenci Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h4><i class="fas fa-flask me-2"></i>LRP</h4>
            <small>Öğrenci Paneli</small>
        </div>
        <ul class="nav flex-column gap-1 mt-3">
            <li class="nav-item">
                <a class="nav-link" onclick="loadBilgisayar()">
                    <i class="fas fa-laptop me-2"></i>Bilgisayarım
                </a>
            </li>
            <li class="nav-item" style="position:absolute; bottom:20px; width:100%;">
                <a class="nav-link text-danger" onclick="localStorage.clear(); location.href='/login.html'">
                    <i class="fas fa-sign-out-alt me-2"></i>Çıkış
                </a>
            </li>
        </ul>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <h5><i class="fas fa-user-graduate me-2"></i>Öğrenci Paneli</h5>
            <span class="text-muted" id="welcomeUser"></span>
        </div>
        <div id="page-content"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const role = localStorage.getItem("userRole");
        const username = localStorage.getItem("username");
        if (!role || role !== "Student") {
            location.href = "/login.html";
        }
        document.getElementById("welcomeUser").innerHTML = `<i class="fas fa-user me-1"></i>${username}`;

        async function loadBilgisayar() {
            const res = await fetch(`/api/admin/students/computer/${username}`);
            if (!res.ok) {
                document.getElementById("page-content").innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Zimmetli bilgisayar bulunamadı. Lütfen yöneticinizle iletişime geçin.
                        </div>`;
                return;
            }
            const pc = await res.json();
            document.getElementById("page-content").innerHTML = `
                    <div class="pc-card">
                        <div class="pc-card-header">
                            <h5 class="mb-0"><i class="fas fa-laptop me-2"></i>${pc.brand}</h5>
                            <small style="color:rgba(255,255,255,0.6)">Demirbaş: ${pc.assetCode ?? "-"}</small>
                        </div>
                        <div class="info-row">
                            <span class="text-muted"><i class="fas fa-microchip me-2"></i>İşlemci</span>
                            <strong>${pc.processor}</strong>
                        </div>
                        <div class="info-row">
                            <span class="text-muted"><i class="fas fa-memory me-2"></i>RAM</span>
                            <strong>${pc.ram} GB</strong>
                        </div>
                        <div class="info-row">
                            <span class="text-muted"><i class="fas fa-plug me-2"></i>HDMI</span>
                            <span class="${pc.hasHdmi ? 'badge-var' : 'badge-yok'}">${pc.hasHdmi ? '✅ Var' : '❌ Yok'}</span>
                        </div>
                        <div class="info-row">
                            <span class="text-muted"><i class="fas fa-wifi me-2"></i>İnternet</span>
                            <span class="${pc.hasInternet ? 'badge-var' : 'badge-yok'}">${pc.hasInternet ? '✅ Var' : '❌ Yok'}</span>
                        </div>
                        <div class="info-row">
                            <span class="text-muted"><i class="fas fa-eye me-2"></i>Veyon</span>
                            <span class="${pc.hasVeyon ? 'badge-var' : 'badge-yok'}">${pc.hasVeyon ? '✅ Var' : '❌ Yok'}</span>
                        </div>
                    </div>`;
        }

        // Sayfa açılınca otomatik yükle
        loadBilgisayar();
    </script>
</body>
</html>
